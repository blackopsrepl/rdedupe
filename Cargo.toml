[package]
name = "rdedupe"
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
license = "CC0-1.0"
authors = ["Vittorio Distefano"]
description = "Exact, resource-bounded, recoverable duplicate file finder"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
ctrlc = "3.4"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
rand = "0.8"
tempfile = "3.14"

[[bench]]
name = "pipeline"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
