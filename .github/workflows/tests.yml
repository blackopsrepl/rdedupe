name: Tests
on:
  push:
  pull_request:
permissions: { contents: read }
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: All suites (exactness, discovery, plans, recovery, resources, skill)
        run: cargo test --locked --all-targets -- --nocapture
  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
  extent-acceptance:
    name: Extent sharing on a real Btrfs filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create a disposable Btrfs loopback filesystem
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q btrfs-progs
          truncate -s 1G "$RUNNER_TEMP/btrfs.img"
          mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          sudo mkdir -p /mnt/btrfs
          sudo mount -o loop "$RUNNER_TEMP/btrfs.img" /mnt/btrfs
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs
      - name: Extent acceptance (must not skip)
        run: |
          TMPDIR=/mnt/btrfs make filesystem-acceptance 2>&1 | tee extent.log
          if grep -q SKIP extent.log; then echo "extent tests skipped on Btrfs"; exit 1; fi
  package:
    name: Static release archive (built and verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: make dist dist-check TARGET=x86_64-unknown-linux-musl
